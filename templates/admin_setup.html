<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Setup | EXAMINTEGRITY</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>

        body {
            margin: 0;
            min-height: 100vh;
            background: #080808;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .setup-container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }

        .setup-card {
            background: #111;
            border: 1px solid #292929;
            border-radius: 18px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .icon {
            text-align: center;
            font-size: 45px;
            margin-bottom: 15px;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
        }

        .warning {
            background: #211b0d;
            border: 1px solid #5a4820;
            color: #d7bc72;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .error-message {
            background: #2a1111;
            border: 1px solid #633333;
            color: #ff8f8f;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #bbb;
            font-size: 14px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            background: #080808;
            color: white;
            border: 1px solid #333;
            border-radius: 9px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #777;
        }

        .setup-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: white;
            color: black;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
        }

        .setup-button:hover {
            background: #ddd;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #888;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            color: white;
        }

    </style>

</head>

<body>

<div class="setup-container">

    <div class="setup-card">

        <div class="icon">
            🔐
        </div>

        <h1>
            Admin Setup
        </h1>

        <div class="subtitle">
            Create the first EXAMINTEGRITY administrator
        </div>

        <div class="warning">

            ⚠️ This page is only available because no
            administrator account exists yet.

            <br><br>

            Choose a strong password with at least
            8 characters.

        </div>

        {% if error %}

            <div class="error-message">
                {{ error }}
            </div>

        {% endif %}

        <form
            method="POST"
            action="{{ url_for('admin_setup') }}"
        >

            <div class="form-group">

                <label for="username">
                    Admin Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Create admin username"
                    required
                    autocomplete="username"
                >

            </div>

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create password"
                    required
                    minlength="8"
                    autocomplete="new-password"
                >

            </div>

            <div class="form-group">

                <label for="confirm_password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Enter password again"
                    required
                    minlength="8"
                    autocomplete="new-password"
                >

            </div>

            <button
                type="submit"
                class="setup-button">

                CREATE ADMIN ACCOUNT

            </button>

        </form>

        <a
            href="{{ url_for('home') }}"
            class="back-link">

            ← Back to Dashboard

        </a>

    </div>

</div>

</body>

</html>
